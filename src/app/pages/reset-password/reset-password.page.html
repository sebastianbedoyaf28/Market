<ion-content class="reset-content">
  <div class="container">
    <h1>Restablecer contraseña</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-item>
        <ion-label position="stacked">Nueva contraseña</ion-label>
        <ion-input [type]="'password'" formControlName="password" autocomplete="new-password" placeholder="••••••••"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Mínimo 8 caracteres</ion-note>

      <ion-item>
        <ion-label position="stacked">Confirmar contraseña</ion-label>
        <ion-input [type]="'password'" formControlName="confirm" autocomplete="new-password" placeholder="••••••••"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="loading || form.invalid">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{ loading ? 'Guardando…' : 'GUARDAR' }}
      </ion-button>
    </form>

    <div class="messages">
      <ion-text color="danger" *ngIf="error">{{ error }}</ion-text>
      <ion-text color="success" *ngIf="info">{{ info }}</ion-text>
    </div>
  </div>
</ion-content>

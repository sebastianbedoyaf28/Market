<ion-content class="forgot-content">
  <div class="container">
    <h1>Recuperar contraseña</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" formControlName="email" autocomplete="email" inputmode="email" placeholder="tu@email.com"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Email inválido</ion-note>

      <ion-button expand="block" type="submit" [disabled]="loading || form.invalid">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{ loading ? 'Enviando…' : 'ENVIAR ENLACE' }}
      </ion-button>
    </form>

    <div class="messages">
      <ion-text color="danger" *ngIf="error">{{ error }}</ion-text>
      <ion-text color="success" *ngIf="info">{{ info }}</ion-text>
    </div>

    <ion-button expand="block" fill="clear" (click)="backToLogin()">Volver a iniciar sesión</ion-button>
  </div>
</ion-content>

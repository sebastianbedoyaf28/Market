<ion-content class="login-content">
  <!-- Header con título -->
  <div class="header">
    <h1 class="title">Acceder</h1>
  </div>

  <!-- Formulario centrado -->
  <div class="form-container">
    <form [formGroup]="form" (ngSubmit)="emailPasswordSignIn()" class="login-form">
      
      <!-- Campo Email -->
      <div class="input-group">
        <label class="input-label">Email</label>
        <ion-input 
          type="email" 
          formControlName="email" 
          inputmode="email" 
          autocomplete="email"
          class="custom-input"
          placeholder="tu@email.com">
        </ion-input>
        <ion-note color="danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="error-message">
          Email inválido
        </ion-note>
      </div>

      <!-- Campo Contraseña -->
      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <ion-input 
          [type]="showPass() ? 'text' : 'password'" 
          formControlName="password" 
          autocomplete="current-password"
          class="custom-input"
          placeholder="••••••••">
        </ion-input>
        
        <!-- Checkbox para mostrar contraseña -->
        <div class="show-password-checkbox">
          <ion-checkbox 
            [checked]="showPass()" 
            (ionChange)="showPass.set($event.detail.checked)"
            class="password-checkbox">
          </ion-checkbox>
          <label class="checkbox-label" (click)="showPass.set(!showPass())">
            Mostrar contraseña
          </label>
        </div>
        
        <ion-note color="danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')" class="error-message">
          Mínimo 8 caracteres
        </ion-note>
      </div>

      <!-- Botón principal -->
      <ion-button 
        expand="block" 
        class="primary-btn" 
        [disabled]="loading || form.invalid" 
        type="submit">
        <ion-spinner *ngIf="loading" name="crescent" class="btn-spinner"></ion-spinner>
        {{ loading ? 'Ingresando…' : 'INGRESAR' }}
      </ion-button>
    </form>

    <!-- Botones secundarios -->
    <div class="secondary-buttons">
      <ion-button 
        expand="block" 
        fill="outline" 
        class="outline-btn"
        [disabled]="loading || form.invalid" 
        (click)="emailPasswordSignUp()">
        CREAR CUENTA
      </ion-button>

      <ion-button 
        expand="block" 
        fill="clear" 
        class="clear-btn"
        [disabled]="loading" 
        (click)="magicLink()">
        USAR ENLACE MÁGICO
      </ion-button>
    </div>

    <!-- Enlace de recuperación -->
    <div class="forgot-password">
      <a class="forgot-link" routerLink="/forgot-password">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <!-- Mensajes de estado -->
    <div class="messages">
      <ion-text color="danger" *ngIf="error" class="error-text">{{ error }}</ion-text>
      <ion-text color="success" *ngIf="info" class="success-text">{{ info }}</ion-text>
    </div>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>Acceder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="emailPasswordSignIn()">
    <ion-item>
      <ion-label position="stacked">Email</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input type="password" formControlName="password"></ion-input>
    </ion-item>
    <ion-button expand="block" class="ion-margin-top" [disabled]="loading" type="submit">Ingresar</ion-button>
    <ion-button expand="block" fill="outline" [disabled]="loading" (click)="emailPasswordSignUp()">Crear cuenta</ion-button>
    <ion-button expand="block" fill="clear" [disabled]="loading" (click)="magicLink()">Usar enlace mágico</ion-button>
    <ion-text color="danger" *ngIf="error">{{ error }}</ion-text>
  </form>
</ion-content>

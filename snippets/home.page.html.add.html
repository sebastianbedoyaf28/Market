<!-- Replace your ion-content list with this -->
<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let p of (products$ | async)">
      <ion-avatar slot="start" *ngIf="p.image_url">
        <img [src]="p.image_url" alt="img">
      </ion-avatar>
      <ion-label>
        <h2>{{ p.name }}</h2>
        <p>\${{ p.price | number:'1.0-0' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
